spring.application.name=facturas_sinteticas_imagenes
server.port=8081
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.openai.com/
spring.ai.openai.image.options.size=1024x1024
spring.ai.openai.image.options.quality=medium
spring.ai.retry.max-attempts=1
#spring.ai.chat.client.enabled=false
spring.ai.openai.embedding.model=text-embedding-3-large
spring.ai.openai.chat.options.model=gpt-5.1
spring.ai.openai.chat.options.reasoning-effort=medium
spring.ai.openai.chat.options.verbosity=medium
event.name.image=new-image
event.name.chat.basic.template=new-basic-template
image.model.name=gpt-image-1
logging.level.org.springframework.http.codec=DEBUG
logging.level.reactor.netty.http.client=DEBUG