# SonarQube project configuration for SonarScanner CLI
sonar.projectKey=facturas_sinteticas_imagenes
sonar.projectName=Facturas Sinteticas Imagenes
sonar.projectVersion=0.0.1

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java binaries
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding
sonar.sourcesEncoding=UTF-8

# Test reports (JUnit)
sonar.junit.reportPaths=target/surefire-reports

# Code coverage reports (JaCoCo)
# Prefer the XML report generated by JaCoCo; also include the exec as a fallback
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.jacoco.reportPaths=target/jacoco.exec

# Exclusions
sonar.exclusions=**/target/**,**/src/test/**
